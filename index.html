     ========================================================= */
  var ACOES = {
    'ir': function (d) { ir(d.rota, d.filtro ? { filtro: d.filtro } : {}); },
    'abrir-pessoa': function (d) { ir('pessoa', { id: d.id }); },
    'voltar': function () { var a = S.anterior || { rota: 'painel' }; ir(a.rota, a.params); },
    'recarregar': function () { limparMemoria(); renderView(); },
    'sair': function () { sair(); },
    'fechar-modal': function () { fecharModal(); },
    'nova-pessoa': function () { modalNovaPessoa(); },
    'atribuir': function (d) { modalAtribuir(d.id, d.nome, d.atual || ''); },
    'aba': function (d) { S.abaFicha = d.aba; desenharAba(); },
    'registrar': function () { modalRegistro(); },
    'editar-pessoa': function () { modalEditarPessoa(); },
    'remover-resp': function () {
      modalMotivo('Remover responsável', 'A pessoa voltará para a lista de "sem responsável". O histórico é mantido.', 'Remover',
        'atribuicoes.remover', { idPessoa: S.ficha.pessoa.id }, 'Responsável removido.');
    },
    'arquivar': function () {
      modalMotivo('Arquivar cadastro', 'O acompanhamento ativo será encerrado. O histórico continua guardado e o cadastro pode ser reativado.', 'Arquivar',
        'pessoas.arquivar', { id: S.ficha.pessoa.id }, 'Cadastro arquivado.');
    },
    'reativar': async function () {
      try { await chamar('pessoas.reativar', { id: S.ficha.pessoa.id }); toast('Cadastro reativado.'); renderView(); }
      catch (e) { toast(e.message, 'erro'); }
    },
    'trocar-foto': function (d) { trocarFoto(d.id, !!d.tem); },
    'pedir-senha': function () { modalPedirSenha(); },
    'trocar-senha-de': function (d) { modalTrocarSenha((S.equipe || []).filter(function (u) { return u.id === d.id; })[0]); },
    'aprovar-pedido': async function (d) {
      if (!await confirmar('Aprovar a nova senha de ' + d.nome + '?', 'A senha escolhida pela pessoa passa a valer agora. Se puder, confirme com ela que foi ela mesma quem pediu.', 'Aprovar')) return;
      try { await chamar('pedidos.aprovar', { id: d.id }); toast('Nova senha aprovada.'); renderView(); } catch (e) { toast(e.message, 'erro'); }
    },
    'recusar-pedido': async function (d) {
      if (!await confirmar('Recusar o pedido de ' + d.nome + '?', 'A senha atual continua valendo.', 'Recusar', true)) return;
      try { await chamar('pedidos.recusar', { id: d.id }); toast('Pedido recusado.'); renderView(); } catch (e) { toast(e.message, 'erro'); }
    },
    'atender-encaminhamento': async function () {
      try { await chamar('acompanhamentos.atenderEncaminhamento', { idPessoa: S.ficha.pessoa.id }); toast('Marcado como atendido.'); renderView(); }
      catch (e) { toast(e.message, 'erro'); }
    },
    'resolver-lembrete': async function () {
      try { await chamar('pessoas.resolverPendencia', { id: S.ficha.pessoa.id }); toast('Lembrete concluído.'); renderView(); }
      catch (e) { toast(e.message, 'erro'); }
    },
    'nova-etapa': function () { modalEtapa(); },
    'editar-etapa': function (d) { modalEtapa((S.etapasEdicao || []).filter(function (e) { return e.id === d.id; })[0]); },
    'mover-etapa': async function (d) {
      try { await chamar('etapas.mover', { id: d.id, direcao: d.direcao }); renderView(); }
      catch (e) { toast(e.message, 'erro'); }
    },
    'novo-usuario': function () { modalUsuario(); },
    'editar-usuario': function (d) { modalUsuario((S.equipe || []).filter(function (u) { return u.id === d.id; })[0]); },
    'redefinir-senha': async function (d) {
      var u = (S.equipe || []).filter(function (x) { return x.id === d.id; })[0];
      if (!await confirmar('Gerar nova senha temporária?', 'A senha atual de ' + u.nome + ' deixará de funcionar.', 'Gerar senha')) return;
      try { var r = await chamar('equipe.redefinirSenha', { id: d.id }); modalSenha(u.nome, u.email, r.senhaTemporaria); }
      catch (e) { toast(e.message, 'erro'); }
    }
  };

  document.addEventListener('click', function (e) {
    var alvo = e.target.closest('[data-acao]');
    if (!alvo || alvo.disabled) return;
    if (alvo.tagName === 'A') e.preventDefault();
    var fn = ACOES[alvo.dataset.acao];
    if (fn) { e.stopPropagation(); fn(alvo.dataset, alvo, e); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });
  window.addEventListener('scroll', function () { var t = $('#topo'); if (t) t.classList.toggle('rolado', window.scrollY > 4); }, { passive: true });

  /* =========================================================
     INÍCIO
     ========================================================= */
  async function iniciar() {
    if (!CFG.appNome) { // telas fora do Google: busca a configuração no servidor
      try { Object.assign(CFG, await chamar('app.config')); }
      catch (e) {
        $('#app').innerHTML = '<div class="carregando-tela">' + vazio('alert', 'Não foi possível conectar', e.message,
          '<button class="btn btn-secundario" style="margin-top:16px" onclick="location.reload()">Tentar novamente</button>') + '</div>';
        return;
      }
    }
    if (CFG.authModo === 'GOOGLE') {
      try { S.usuario = (await chamar('auth.sessao')).usuario; entrar(); }
      catch (e) { $('#app').innerHTML = '<div class="carregando-tela">' + vazio('lock', 'Acesso não liberado', e.message) + '</div>'; }
      return;
    }
    S.token = store.get(CHAVE_TOKEN);
    if (!S.token) return renderLogin();
    try {
      S.usuario = (await chamar('auth.sessao')).usuario;
      if (S.usuario.trocarSenha) renderTrocaObrigatoria(); else entrar();
    } catch (e) {
      store.set(CHAVE_TOKEN, null); S.token = null;
      renderLogin();
    }
  }

  window.ConsolidacaoApp = { iniciar: iniciar };
  iniciar();
})();
</script>

  </body>
</html>
